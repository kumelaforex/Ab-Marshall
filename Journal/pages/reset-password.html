<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Ab Marshall</title>

  <link
    rel="stylesheet"
    href="../css/global.css">

  <link
    rel="stylesheet"
    href="../css/auth.css">

  <!-- FLATICON UICONS -->
  <link
    rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

  <link
    rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css">

  <link
    rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <!-- LOGO -->
      <div class="auth-logo">

        <img
          src="../assets/logo.png"
          alt="Ab Marshall">

      </div>


      <!-- HEADING -->
      <div class="auth-heading">

        <span class="eyebrow">
          AB MARSHALL
        </span>

        <h1>
          Reset Password
        </h1>

        <p>
          Create a new secure password for your account.
        </p>

      </div>


      <!-- RESET PASSWORD FORM -->
      <form id="resetPasswordForm">

        <!-- NEW PASSWORD -->
        <div class="form-group password-group">

          <label for="resetPassword">

            <i class="fi fi-sr-lock"></i>

            <span>
              New Password
            </span>

          </label>


          <div class="password-wrapper">

            <input
              type="password"
              id="resetPassword"
              placeholder="Enter new password"
              autocomplete="new-password"
              minlength="8"
              required>


            <button
              type="button"
              class="password-toggle"
              id="resetPasswordToggle"
              aria-label="Show password"
              title="Show password">

              <i class="fi fi-rr-eye-crossed"></i>

            </button>

          </div>

        </div>


        <!-- PASSWORD REQUIREMENTS -->
        <div class="password-requirements">

          <span>
            Password must contain:
          </span>

          <ul>

            <li>
              At least 8 characters
            </li>

            <li>
              One uppercase letter
            </li>

            <li>
              One lowercase letter
            </li>

            <li>
              One number
            </li>

            <li>
              One special character
              such as $ & @ ! # %
            </li>

          </ul>

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="form-group password-group">

          <label for="resetConfirmPassword">

            <i class="fi fi-sr-lock"></i>

            <span>
              Confirm Password
            </span>

          </label>


          <div class="password-wrapper">

            <input
              type="password"
              id="resetConfirmPassword"
              placeholder="Confirm new password"
              autocomplete="new-password"
              minlength="8"
              required>


            <button
              type="button"
              class="password-toggle"
              id="resetConfirmPasswordToggle"
              aria-label="Show password"
              title="Show password">

              <i class="fi fi-rr-eye-crossed"></i>

            </button>

          </div>

        </div>


        <!-- MESSAGE -->
        <div
          id="resetPasswordMessage"
          class="auth-message">
        </div>


        <!-- UPDATE PASSWORD -->
        <button
          type="submit"
          class="auth-btn"
          id="resetPasswordBtn">

          <span>
            UPDATE PASSWORD
          </span>

          <i class="fi fi-rr-lock"></i>

        </button>

      </form>


      <!-- FOOTER -->
      <div class="auth-footer">

        <span>
          Remember your password?
        </span>

        <a href="login.html">
          Sign In
        </a>

      </div>


      <!-- POWERED BY -->
      <div class="powered-by">
        POWERED BY KUMELA
      </div>

    </section>

  </main>


  <!-- SUPABASE -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script src="../js/supabase.js"></script>

  <script src="../js/reset-password.js"></script>

</body>

</html>
