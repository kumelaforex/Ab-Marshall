<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Create Account | Ab Marshall</title>


  <link
    rel="stylesheet"
    href="../css/global.css">

  <link
    rel="stylesheet"
    href="../css/auth.css">


  <!-- FLATICON UICONS -->

  <link
    rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

  <link
    rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css">

  <link
    rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css">

</head>


<body>


  <main class="auth-page">


    <section class="auth-card">


      <!-- LOGO -->

      <div class="auth-logo">

        <img
          src="../assets/logo.png"
          alt="Ab Marshall">

      </div>


      <!-- HEADING -->

      <div class="auth-heading">

        <span class="eyebrow">
          AB MARSHALL
        </span>

        <h1>
          Create Account
        </h1>

        <p>
          Start your Forex Challenge journal.
        </p>

      </div>


      <!-- SIGNUP FORM -->

      <form id="signupForm">


        <!-- FULL NAME -->

        <div class="form-group">

          <label for="signupName">

            <i class="fi fi-rr-user"></i>

            <span>
              Full Name
            </span>

          </label>


          <input
            type="text"
            id="signupName"
            placeholder="Enter your name"
            autocomplete="name"
            required>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="signupEmail">

            <i class="fi fi-sr-envelope"></i>

            <span>
              Email
            </span>

          </label>


          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required>

        </div>


        <!-- PASSWORD -->

        <div class="form-group password-group">

          <label for="signupPassword">

            <i class="fi fi-sr-lock"></i>

            <span>
              Password
            </span>

          </label>


          <div class="password-wrapper">

            <input
              type="password"
              id="signupPassword"
              placeholder="Minimum 8 characters"
              autocomplete="new-password"
              minlength="8"
              required>


            <button
              type="button"
              class="password-toggle"
              id="signupPasswordToggle"
              aria-label="Show password"
              title="Show password">

              <i class="fi fi-rr-eye-crossed"></i>

            </button>

          </div>

        </div>


        <!-- PASSWORD REQUIREMENTS -->

        <div class="password-requirements">

          <span>
            Password must contain:
          </span>

          <ul>

            <li>
              At least 8 characters
            </li>

            <li>
              One uppercase letter
            </li>

            <li>
              One lowercase letter
            </li>

            <li>
              One number
            </li>

            <li>
              One special character
              such as $ & @ ! # %
            </li>

          </ul>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group password-group">

          <label for="signupConfirmPassword">

            <i class="fi fi-sr-lock"></i>

            <span>
              Confirm Password
            </span>

          </label>


          <div class="password-wrapper">

            <input
              type="password"
              id="signupConfirmPassword"
              placeholder="Confirm password"
              autocomplete="new-password"
              minlength="8"
              required>


            <button
              type="button"
              class="password-toggle"
              id="signupConfirmPasswordToggle"
              aria-label="Show password"
              title="Show password">

              <i class="fi fi-rr-eye-crossed"></i>

            </button>

          </div>

        </div>


        <!-- MESSAGE -->

        <div
          id="signupMessage"
          class="auth-message">
        </div>


        <!-- CREATE ACCOUNT -->

        <button
          type="submit"
          class="auth-btn"
          id="signupBtn">

          <span>
            CREATE ACCOUNT
          </span>

          <i class="fi fi-rs-enter"></i>

        </button>


      </form>


      <!-- FOOTER -->

      <div class="auth-footer">

        <span>
          Already have an account?
        </span>

        <a href="login.html">
          Sign In
        </a>

      </div>


      <!-- POWERED BY -->

      <div class="powered-by">
        POWERED BY KUMELA
      </div>


    </section>

  </main>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <script src="../js/supabase.js"></script>

  <script src="../js/auth-page.js"></script>


</body>

</html>
