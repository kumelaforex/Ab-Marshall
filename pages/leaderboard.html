<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Leaderboard | Ab Marshall Forex Challenge</title>
  
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/leaderboard.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
</head>

<body>
  
  <aside class="sidebar" id="sidebar">
    
    <div class="brand">
      <img src="../assets/logo.png" alt="Ab Marshall">
      <span>AB MARSHALL</span>
    </div>
    
    <nav class="nav-menu">
      
      <a href="dashboard.html" class="nav-link">
        <span>▦</span>
        <span>Dashboard</span>
      </a>
      
      <a href="trade-journal.html" class="nav-link">
        <span>▤</span>
        <span>Trade Journal</span>
      </a>
      
      <a href="challenge.html" class="nav-link">
        <span>◈</span>
        <span>Challenge</span>
      </a>
      
      <a href="analytics.html" class="nav-link">
        <span>◒</span>
        <span>Analytics</span>
      </a>
      
      <a href="leaderboard.html" class="nav-link active">
        <span>♛</span>
        <span>Leaderboard</span>
      </a>
      
      <a href="profile.html" class="nav-link">
        <span>◯</span>
        <span>Profile</span>
      </a>
      
      <a href="settings.html" class="nav-link">
        <span>⚙</span>
        <span>Settings</span>
      </a>
      
    </nav>
    
    <button class="logout-btn" onclick="logout()">
      LOG OUT
    </button>
    
  </aside>
  
  
  <main class="main-content">
    
    <header class="topbar">
      
      <button class="menu-btn" id="menuBtn">
        ☰
      </button>
      
      <div>
        <h1>Leaderboard</h1>
        <p>View challenge community statistics.</p>
      </div>
      
    </header>
    
    
    <section class="dashboard-container">
      
      <section class="panel">
        
        <div class="panel-header">
          
          <div>
            <h3>Leaderboard</h3>
            <p>
              Traders are shown using their public username.
            </p>
          </div>
          
          <button class="refresh-btn" id="refreshLeaderboard">
            REFRESH
          </button>
          
        </div>
        
        
        <div class="table-wrapper">
          
          <table>
            
            <thead>
              <tr>
                <th>#</th>
                <th>Trader</th>
                <th>Trades</th>
                <th>Wins</th>
                <th>Win Rate</th>
                <th>Total P/L</th>
              </tr>
            </thead>
            
            <tbody id="leaderboardBody">
              
              <tr>
                <td colspan="6" class="empty-state">
                  Loading leaderboard...
                </td>
              </tr>
              
            </tbody>
            
          </table>
          
        </div>
        
      </section>
      
    </section>
    
  </main>
  
  
  <script src="../js/leaderboard.js"></script>
  <script src="../app.js"></script>
  
</body>

</html>
